# SecuritySpy 6 on the main domain, behind Organizr auth.
#
# SS6 has no configurable base URL, so its exact paths are matched here and
# proxied with credentials injected per Organizr group: the $group ->
# $secspybase64_password map lives in site-confs/00-custom.conf and picks the
# matching org_* SecuritySpy user from golift/secrets.conf.
#
# Path inventory generated against SecuritySpy 6.20 (index.html + all JS/CSS).
# The mobile app does NOT use this; it talks to the ss.* vhost directly.

# API (everything under /++), top-level pages, and root-level scripts.
location ~ ^/(\+\+|live$|download|index\.html$|strings(-geo)?\.js$|Request401ResponseForLogOut) {
    include /config/nginx/auth/user.conf;

    proxy_set_header Authorization "Basic $secspybase64_password";
    proxy_set_header Host "proxy.ss.$host";
    proxy_pass       $secspy$request_uri;
}

# UI assets. Exact filenames only: /js and /css are shared with Organizr and
# YOURLS on this domain, and /img belongs to Chevereto (its locations sort
# earlier and keep priority for /img/images/ uploads and app files).
location ~ ^/(js/(Alert|Player|PopMenu|PtzPicker|audio|captures|clips|dashboard|keyToMacVirtualKeycode|litepicker|live|localisation|range-fix|screen|script|settings)\.js$|css/VideoControls\.css$|img/[A-Za-z0-9._-]+\.(png|svg)$) {
    include /config/nginx/auth/user.conf;

    proxy_set_header Authorization "Basic $secspybase64_password";
    proxy_set_header Host "proxy.ss.$host";
    proxy_pass       $secspy$request_uri;
}

# /css/style.css is claimed by BOTH SecuritySpy and YOURLS admin (both hardcode
# the path). SecuritySpy requests it with a numeric version query (?6.20);
# YOURLS uses ?v=… — route on that. The old hand-merged copy at
# /config/www/css/style.css is obsolete and should be deleted on deploy so
# YOURLS falls through to its own file.
location = /css/style.css {
    include /config/nginx/auth/user.conf;

    proxy_set_header Authorization "Basic $secspybase64_password";
    proxy_set_header Host "proxy.ss.$host";
    if ($args ~ ^\d) {
        proxy_pass $secspy$request_uri;
    }
    root      /config/www;
    try_files $uri /yourls$uri =404;
}
