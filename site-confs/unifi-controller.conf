# UniFi Controller
#
# Double auth: Organizr admin (group 0) in front of UniFi's own login.
# Requires the Organizr cookie to be valid for *.$maindomain (Organizr
# Settings -> Main -> Domain must be set to the apex domain, not the full
# host). On 401 we bounce to the Organizr login on the apex domain.
server {
    server_name unifi.*;
    access_log  /config/log/nginx/unifi_access.log better;
    listen      443 ssl;
    http2      on;
    include     /config/nginx/ssl.conf;
    include     /config/nginx/proxy.conf;

    location / {
        auth_request     /auth-0;
        auth_request_set $user $upstream_http_x_organizr_user;
        more_set_headers "X-WEBAUTH-USER: $user";
        error_page 401 https://$maindomain/?return=$scheme://$http_host$request_uri;

        proxy_pass $unifi$request_uri;
        more_set_headers "Content-Security-Policy: frame-ancestors https://*.$maindomain https://$maindomain";
    }

    # Organizr auth endpoint (same as default.conf, needed per server block).
    location ~ ^/auth-(.*) {
        internal;
        proxy_pass              $organizr/api/v2/auth?group=$1;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }
}
