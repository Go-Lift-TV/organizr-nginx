# Home Assistant (replaces Indigo on the ha.* names)
#
# DNS triad:
#   ha.example.com       -> DNS-only (no CF proxy) -> router -> SWAG (public; Alexa mTLS)
#   ha.home.example.com  -> router (direct, no CF) -> SWAG (mobile app; HA's own auth)
#   ha.slvr.example.com  -> private IP -> SWAG             (LAN; HA's own auth)
#
# HA needs these in configuration.yaml or the proxied requests are rejected:
#   http:
#     use_x_forwarded_for: true
#     trusted_proxies:
#       - 192.168.3.2      # unRAID/SWAG host
#       - 172.16.0.0/12    # docker bridge

# Direct names: mobile app + LAN. HA handles authentication itself.
server {
    server_name ha.home.* ha.slvr.*;
    listen      443 ssl;
    http2      on;
    access_log  /config/log/nginx/ha_access.log better;
    include     /config/nginx/ssl.conf;
    include     /config/nginx/proxy.conf;

    location / {
        proxy_pass $homeassistant;
    }
}

# Public name. Must be DNS-only in Cloudflare (grey cloud): mTLS requires
# the TLS handshake to terminate here at nginx, not at Cloudflare's edge.
#
# The Alexa Lambda presents a client certificate issued by the house step-ca.
# pki/home_ca.crt is the CA chain (root + intermediate), git-ignored; see
# https://github.com/golift/alexa-homeassistant for how to create it.
server {
    server_name ha.*;
    listen      443 ssl;
    http2      on;
    access_log  /config/log/nginx/ha_access.log better;
    include     /config/nginx/ssl.conf;
    include     /config/nginx/proxy.conf;

    ssl_client_certificate /config/nginx/pki/home_ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    # Alexa smart home directives: valid client certificate required.
    location /api/alexa/smart_home {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass $homeassistant;
    }

    # OAuth account linking: Amazon's token exchange and the login page the
    # Alexa app opens in a browser. No client cert here; HA's own auth (with
    # rate limiting and IP banning) guards these endpoints.
    location /auth/ {
        proxy_pass $homeassistant;
    }

    # Static assets the /auth/authorize login page loads.
    location /frontend_latest/ { proxy_pass $homeassistant; }
    location /frontend_es5/    { proxy_pass $homeassistant; }
    location /static/          { proxy_pass $homeassistant; }

    # Everything else stays LAN-only. Remote browser/app access uses
    # ha.home.* instead.
    location / {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny  all;
        proxy_pass $homeassistant;
    }
}
