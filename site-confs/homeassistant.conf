# Home Assistant (replaces Indigo on the ha.* names)
#
# DNS triad:
#   ha.example.com       -> Cloudflare -> router -> SWAG  (public; Alexa/mTLS in Phase 3)
#   ha.home.example.com  -> router (direct, no CF) -> SWAG (mobile app; HA's own auth)
#   ha.slvr.example.com  -> private IP -> SWAG             (LAN; HA's own auth)
#
# HA needs these in configuration.yaml or the proxied requests are rejected:
#   http:
#     use_x_forwarded_for: true
#     trusted_proxies:
#       - 192.168.3.2      # unRAID/SWAG host
#       - 172.16.0.0/12    # docker bridge

# Direct names: mobile app + LAN. HA handles authentication itself.
server {
    server_name ha.home.* ha.slvr.*;
    listen      443 ssl;
    http2      on;
    access_log  /config/log/nginx/ha_access.log better;
    include     /config/nginx/ssl.conf;
    include     /config/nginx/proxy.conf;

    location / {
        proxy_pass $homeassistant;
    }
}

# Public name (via Cloudflare). INTERIM LOCKDOWN until Phase 3 wires up
# mTLS + the Alexa Lambda: only LAN clients may use this name. Cloudflare
# visitors resolve to their real IP (set_real_ip_from in 00-custom.conf),
# so Internet traffic is denied here.
server {
    server_name ha.*;
    listen      443 ssl;
    http2      on;
    access_log  /config/log/nginx/ha_access.log better;
    include     /config/nginx/ssl.conf;
    include     /config/nginx/proxy.conf;

    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny  all;

    location / {
        proxy_pass $homeassistant;
    }
}
