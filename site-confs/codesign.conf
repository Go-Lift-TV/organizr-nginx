# Remote Authenticode signing (golift/codesign signerd).
#
# DNS: sign.* must be DNS-only in Cloudflare (grey cloud). Orange-cloud
# proxy terminates TLS at Cloudflare and breaks ssl_verify_client
# (BYO-CA mTLS is Enterprise-only).
#
# Gate 1: mTLS against the house step-ca (pki/home_ca.crt). No public
# exceptions. Gate 2 (GitHub Actions OIDC) is inside signerd.
#
# Upstream $codesign is in proxy.conf (Docker DNS name, not loopback).
# Never proxy_pass to 127.0.0.1: if allow_unauthenticated_loopback is on,
# a loopback upstream would skip OIDC for every proxied request.

server {
    server_name sign.*;
    listen      443 ssl;
    http2      on;
    access_log  /config/log/nginx/codesign_access.log better;
    include     /config/nginx/ssl.conf;
    include     /config/nginx/proxy.conf;

    ssl_client_certificate /config/nginx/pki/home_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    location / {
        # PE/MSI uploads are large; signing waits on the token + RFC 3161 TSA.
        # These must live in location {}, not server {}: this vhost includes
        # proxy.conf which already sets proxy_read_timeout at server scope.
        client_max_body_size 100M;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_request_buffering off;
        proxy_pass $codesign;
    }
}
