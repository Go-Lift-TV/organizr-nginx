# SecuritySpy — direct passthrough, SecuritySpy's own auth (basic auth).
#
# DNS triad:
#   ss.golift.tv       -> Cloudflare -> router -> SWAG
#   ss.home.golift.tv  -> router (direct, no CF) -> SWAG  (mobile app uses this)
#   ss.slvr.golift.tv  -> private IP -> SWAG              (LAN)
#
# No Organizr wall here on purpose: the iOS/macOS apps authenticate with
# SecuritySpy directly. Browser access via Organizr uses the main domain
# (golift/securityspy.conf) with per-group credential injection instead.
server {
    server_name ss.*;
    access_log  /config/log/nginx/ss_access.log local;
    listen      443 ssl;
    http2      on;
    include     /config/nginx/ssl.conf;
    include     /config/nginx/proxy.conf;

    location    / {
        proxy_pass $secspy$request_uri;
    }
}
